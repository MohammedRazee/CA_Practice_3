<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Room Bookings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hotel Room Bookings</h1>
    <p>CA Lab Practice &middot; Set 3</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Rooms</button>
          <button id="top-three" type="button">3 Costliest Rooms</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by type</h2>
        <form id="search-form" class="inline">
          <select name="type" required>
            <option value="">Choose a type...</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Rent less than
            <input type="number" name="maxRent" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Room</h2>
        <form id="add-form" class="stack">
        <label>Room
          <input type="text" name="room" required>
        </label>
        <label>Type
          <select name="type" required>
            <option value="">Choose...</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
          </select>
        </label>
        <label>Floor
          <input type="number" name="floor" step="1" required>
        </label>
        <label>Rent
          <input type="number" name="rent" step="1" required>
        </label>
          <button type="submit">Add Room</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
